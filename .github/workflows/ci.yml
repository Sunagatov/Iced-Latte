name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Build, unit tests, integration tests and coverage
        id: build
        run: mvn -B clean verify --file pom.xml --no-transfer-progress

      - name: Upload coverage to Codecov
        id: coverage
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./target/site/jacoco/jacoco.xml
          fail_ci_if_error: ${{ github.actor != 'dependabot[bot]' }}

      - name: SonarCloud analysis
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn -B sonar:sonar \
            -Dsonar.projectKey=Sunagatov_Iced-Latte \
            -Dsonar.organization=zufar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            --no-transfer-progress

      - name: Notify Telegram on success
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          MSG: ${{ github.event.pull_request.title || github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST https://api.telegram.org/bot${BOT_TOKEN}/sendMessage \
            -d chat_id=${CHAT_ID} \
            -d text="[OK] CI: Build/Test passed%0ARepo: ${REPO}%0ABranch: ${BRANCH}%0ASha: ${SHA:0:7}%0ABy: ${ACTOR}%0AMsg: ${MSG}%0A${RUN_URL}"

      - name: Notify Telegram on failure
        if: failure()
        env:
          FAILED_STAGE: ${{ steps.build.outcome == 'failure' && 'Build/tests' || steps.coverage.outcome == 'failure' && 'Coverage upload' || steps.sonar.outcome == 'failure' && 'SonarCloud analysis' || 'Build setup' }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          MSG: ${{ github.event.pull_request.title || github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST https://api.telegram.org/bot${BOT_TOKEN}/sendMessage \
            -d chat_id=${CHAT_ID} \
            -d text="[FAIL] CI: ${FAILED_STAGE} failed%0ARepo: ${REPO}%0ABranch: ${BRANCH}%0ASha: ${SHA:0:7}%0ABy: ${ACTOR}%0AMsg: ${MSG}%0A${RUN_URL}"

  owasp:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      DEPENDENCY_CHECK_VERSION: '13.0.0'
      DEPENDENCY_CHECK_DATA: ${{ github.workspace }}/.dependency-check-data
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Restore vulnerability database
        id: dependency-data
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.DEPENDENCY_CHECK_DATA }}
          key: ${{ runner.os }}-dependency-check-${{ env.DEPENDENCY_CHECK_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-dependency-check-${{ env.DEPENDENCY_CHECK_VERSION }}-

      # Bootstrap once from the scanner's own mirror, then fetch fresh NVD API
      # changes below. Downloading every CVE through the API timed out on cold CI.
      - name: Bootstrap vulnerability database on cache miss
        if: steps.dependency-data.outputs.cache-matched-key == ''
        run: |
          mvn -B "org.owasp:dependency-check-maven:${DEPENDENCY_CHECK_VERSION}:update-only" \
            -DdataDirectory="${DEPENDENCY_CHECK_DATA}" \
            -DnvdDatafeedUrl='https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/nvdcve-{0}.json.gz' \
            -DfailOnError=true \
            --no-transfer-progress

      - name: Update vulnerability database from NVD
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn -B "org.owasp:dependency-check-maven:${DEPENDENCY_CHECK_VERSION}:update-only" \
            -DdataDirectory="${DEPENDENCY_CHECK_DATA}" \
            -DnvdApiKey="${NVD_API_KEY}" \
            -DnvdValidForHours=0 \
            -DfailOnError=true \
            --no-transfer-progress

      # Save a completed update even if the later scan detects vulnerabilities.
      - name: Save updated vulnerability database
        uses: actions/cache/save@v6
        with:
          path: ${{ env.DEPENDENCY_CHECK_DATA }}
          key: ${{ steps.dependency-data.outputs.cache-primary-key }}

      - name: Run OWASP Dependency-Check
        id: owasp
        run: |
          mvn -B "org.owasp:dependency-check-maven:${DEPENDENCY_CHECK_VERSION}:check" \
            -DdataDirectory="${DEPENDENCY_CHECK_DATA}" \
            -DautoUpdate=false \
            -DfailOnError=true \
            -DfailBuildOnCVSS=7 \
            -DsuppressionFile=.github/owasp-suppressions.xml \
            --no-transfer-progress
          echo "status=clean" >> $GITHUB_OUTPUT

      - name: Notify Telegram on success
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          MSG: ${{ github.event.pull_request.title || github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST https://api.telegram.org/bot${BOT_TOKEN}/sendMessage \
            -d chat_id=${CHAT_ID} \
            -d text="[OK] OWASP: No vulnerabilities found%0ARepo: ${REPO}%0ABranch: ${BRANCH}%0ASha: ${SHA:0:7}%0ABy: ${ACTOR}%0AMsg: ${MSG}%0A${RUN_URL}"

      - name: Notify Telegram on failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          MSG: ${{ github.event.pull_request.title || github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST https://api.telegram.org/bot${BOT_TOKEN}/sendMessage \
            -d chat_id=${CHAT_ID} \
            -d text="[ALERT] OWASP check failed%0ARepo: ${REPO}%0ABranch: ${BRANCH}%0ASha: ${SHA:0:7}%0ABy: ${ACTOR}%0AMsg: ${MSG}%0A${RUN_URL}"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owasp-report
          path: target/dependency-check-report.html

  openapi-diff:
    name: OpenAPI Breaking Change Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for breaking changes in API specs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          OASDIFF_IMAGE: tufin/oasdiff:v1.11.8
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            REF="origin/${BASE_REF}"
          else
            REF="HEAD~1"
          fi
          BREAKING=0
          BASE_DIR=.api-specs-base
          mkdir -p "$BASE_DIR"
          for f in src/main/resources/api-specs/*.yaml; do
            name=$(basename "$f")
            git show ${REF}:"$f" > "$BASE_DIR/$name" 2>/dev/null || true
          done
          for spec in src/main/resources/api-specs/*-openapi.yaml; do
            name=$(basename "$spec")
            [ -f "$BASE_DIR/$name" ] || continue
            if docker run --rm -v "$PWD:/work" -w /work "$OASDIFF_IMAGE" breaking "$BASE_DIR/$name" "$spec" --fail-on ERR --err-ignore .github/oasdiff-auth-hardening.ignore; then
              echo "[OK] No breaking changes in $name"
            else
              echo "[FAIL] Breaking changes detected in $name"
              BREAKING=1
            fi
          done
          exit $BREAKING

      - name: Notify Telegram on success
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          MSG: ${{ github.event.pull_request.title || github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST https://api.telegram.org/bot${BOT_TOKEN}/sendMessage \
            -d chat_id=${CHAT_ID} \
            -d text="[OK] CI: No breaking API changes%0ARepo: ${REPO}%0ABranch: ${BRANCH}%0ASha: ${SHA:0:7}%0ABy: ${ACTOR}%0AMsg: ${MSG}%0A${RUN_URL}"

      - name: Notify Telegram on failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          MSG: ${{ github.event.pull_request.title || github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST https://api.telegram.org/bot${BOT_TOKEN}/sendMessage \
            -d chat_id=${CHAT_ID} \
            -d text="[FAIL] CI: Breaking API change detected%0ARepo: ${REPO}%0ABranch: ${BRANCH}%0ASha: ${SHA:0:7}%0ABy: ${ACTOR}%0AMsg: ${MSG}%0A${RUN_URL}"
